# Builds the site and publishes it to GitHub Pages on every push to main.
# Requires Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The same permissions as GitHub's own Pages starter workflows.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer run waits; it does not cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run check
      # npm run build validates data/ first and stops on any bad entry.
      - run: npm run build
        env:
          # Taken from the Pages settings, so a custom domain later needs no code change.
          ATLAS_SITE: ${{ steps.pages.outputs.origin }}
          ATLAS_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
